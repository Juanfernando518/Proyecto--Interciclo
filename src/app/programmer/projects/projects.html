<div class="projects-container fade-in">
  
  <header class="header-flex">
    <div>
      <h1>📂 Mis Proyectos</h1>
      <p>Muestra tu mejor trabajo al mundo.</p>
    </div>
    <button class="btn-add" (click)="mostrarFormulario = !mostrarFormulario">
      {{ mostrarFormulario ? 'Cancelar' : '+ Nuevo Proyecto' }}
    </button>
  </header>

  @if (mostrarFormulario) {
    <div class="project-form slide-down">
      <h3>✨ Crear Nuevo Proyecto</h3>
      
      <div class="form-grid">
        <input type="text" [(ngModel)]="nuevoProyecto.nombre" placeholder="Título del Proyecto (Ej: E-commerce)" class="input-field">
        
        <input type="text" [(ngModel)]="nuevoProyecto.imagenUrl" placeholder="URL de Imagen (Opcional)" class="input-field">
        
        <input type="text" [(ngModel)]="nuevoProyecto.repoUrl" placeholder="Link a GitHub" class="input-field">
        
        <input type="text" [(ngModel)]="nuevoProyecto.deployUrl" placeholder="Link Demo / Web" class="input-field">
      </div>
      
      <textarea [(ngModel)]="nuevoProyecto.descripcion" placeholder="Describe qué tecnologías usaste..." rows="3" class="input-area"></textarea>
      
      <button (click)="guardarProyecto()" class="btn-save">Guardar Proyecto</button>
    </div>
  }

  <div class="projects-grid">
    @for (proy of proyectos; track proy.id) {
      <div class="project-card">
        <div class="card-img" [style.backgroundImage]="'url(' + (proy.imagenUrl || 'https://via.placeholder.com/300') + ')'"></div>
        
        <div class="card-content">
          <h3>{{ proy.titulo }}</h3>
          <p>{{ proy.descripcion }}</p>
          
          <div class="links">
            @if (proy.repoUrl) {
              <a [href]="proy.repoUrl" target="_blank">GitHub</a>
            }
            
            @if (proy.demoUrl) {
              <a [href]="proy.demoUrl" target="_blank">Demo</a>
            }
          </div>
        </div>

        <button class="btn-delete" (click)="eliminar(proy.id)">🗑️</button>
      </div>
    } @empty {
      <div class="empty-state">
        <p>Aún no has subido proyectos.</p>
      </div>
    }
  </div>

</div>
