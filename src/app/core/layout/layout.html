<nav class="navbar">
  <div class="nav-left">
    <a routerLink="/" class="logo">🚀 DevPortfolio</a>
    
    <div class="menu-items">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">🏠 Inicio</a>

      @if (rol === 'PROGRAMADOR') {
        <a routerLink="/programmer/dashboard" routerLinkActive="active">📊 Dashboard</a>
        <a routerLink="/programmer/projects" routerLinkActive="active">📂 Mis Proyectos</a>
        <a routerLink="/programmer/advice-requests" routerLinkActive="active">📅 Solicitudes</a>
        <a routerLink="/programmer/profile" routerLinkActive="active">👤 Mi Perfil</a>
      }

      @if (rol === 'ADMIN') {
        <a routerLink="/admin" routerLinkActive="active">🛡️ Admin</a>
      }

      @if (rol === 'USUARIO') {
        <a routerLink="/user/my-requests" routerLinkActive="active">📅 Mis Citas</a>
      }
    </div>
  </div>

  <div class="nav-right">
    @if (rol) {
      <span class="role-badge" [class]="rol">{{ rol }}</span>
      <button (click)="logout()" class="btn-logout">Salir</button>
    }
    
    @if (!rol) {
      <a routerLink="/auth/login" class="btn-login-nav">🔐 Ingresar</a>
    }
  </div>
</nav>

<div class="content">
  <router-outlet></router-outlet>
</div>
